<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#18243b">
  <meta name="description" content="StudySpace notes with typing, pen writing, subjects, lists, highlighting, and offline support.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>StudySpace Notes</title>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="brand-mark">S</div><div><strong>StudySpace</strong><small id="subtitle">Your study notebook</small></div></div>
    <div class="top-actions">
      <select id="language" aria-label="Language">
        <option value="ku">کوردی</option><option value="en">English</option><option value="ar">العربية</option>
      </select>
      <button id="backupExport" class="quiet" title="Export backup">↗ <span data-i18n="backup">Backup</span></button>
      <label class="quiet import-label">↙ <span data-i18n="restore">Restore</span><input id="backupImport" type="file" accept="application/json" hidden></label>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <div class="side-heading"><span data-i18n="subjects">Subjects</span><button id="addSubject" class="icon-button" aria-label="Add subject">＋</button></div>
      <nav id="subjectList" aria-label="Subjects"></nav>
      <div class="sidebar-foot"><span class="save-dot"></span><span id="saveStatus" data-i18n="saved">Saved on this device</span></div>
    </aside>
    <main class="main">
      <div class="subject-heading">
        <div><p class="eyebrow" data-i18n="notebook">STUDY NOTEBOOK</p><h1 id="subjectTitle">کوردی</h1></div>
        <button id="newNote" class="primary">＋ <span data-i18n="newNote">New note</span></button>
      </div>
      <div class="note-layout">
        <section class="notes-panel">
          <div class="notes-title"><strong data-i18n="myNotes">My notes</strong><span id="noteCount" class="count">0</span></div>
          <div id="notesList" class="notes-list"></div>
        </section>
        <section class="editor-panel">
          <input id="noteTitle" class="note-title-input" placeholder="Note title..." maxlength="160" aria-label="Note title">
          <div class="mode-tabs">
            <button class="mode-tab active" data-mode="type">⌨ <span data-i18n="typing">Typing</span></button>
            <button class="mode-tab" data-mode="pen">✎ <span data-i18n="penPaper">Pen paper</span></button>
          </div>
          <div id="typingTools" class="toolbar">
            <button data-command="bold" title="Bold"><b>B</b></button>
            <button data-command="italic" title="Italic"><i>I</i></button>
            <button data-command="insertUnorderedList" title="Bullet list">• <span data-i18n="bullets">Bullets</span></button>
            <button data-command="insertOrderedList" title="Numbered list">1. <span data-i18n="numbers">Numbers</span></button>
            <button id="todoButton" title="Checklist">☑ <span data-i18n="todo">To-do</span></button>
            <label class="tool-select" title="Font size">A <select id="fontSize" aria-label="Font size"><option value="2">Small</option><option value="3" selected>Normal</option><option value="4">Large</option><option value="5">XL</option><option value="6">XXL</option></select></label>
            <label class="tool-color" title="Text color">A <input type="color" id="textColor" value="#26344b" aria-label="Text color"></label>
            <label class="tool-color" title="Highlight color">▰ <input type="color" id="highlightColor" value="#ffeb75" aria-label="Highlight color"></label>
            <button id="highlightButton" title="Highlight selection">▰ <span data-i18n="highlight">Highlight</span></button>
            <button id="clearFormat" title="Remove formatting">Tx</button>
          </div>
          <div id="typingArea" class="typing-area" contenteditable="true" spellcheck="true" role="textbox" aria-multiline="true" data-placeholder="Write your notes here..."></div>
          <div id="penTools" class="pen-toolbar hidden">
            <label>✎ <span data-i18n="penColor">Pen</span> <input type="color" id="penColor" value="#20345b"></label>
            <label>↔ <span data-i18n="size">Size</span> <input id="penSize" type="range" min="1" max="14" value="3"></label>
            <button id="eraserButton">⌫ <span data-i18n="eraser">Eraser</span></button>
            <button id="undoButton">↶ <span data-i18n="undo">Undo</span></button>
            <button id="clearCanvas">✕ <span data-i18n="clear">Clear</span></button>
            <button id="saveDrawing" class="primary">✓ <span data-i18n="saveDrawing">Save drawing</span></button>
          </div>
          <div id="penArea" class="pen-area hidden">
            <div class="paper-label" data-i18n="paperTip">Write with your stylus or finger on the grid paper.</div>
            <canvas id="drawingCanvas" aria-label="Handwriting canvas"></canvas>
          </div>
          <div class="editor-footer"><span id="wordCount">0 words</span><span data-i18n="autoSave">Auto-saves on this device</span></div>
        </section>
      </div>
    </main>
  </div>
  <dialog id="subjectDialog">
    <form method="dialog" id="subjectForm">
      <h2 data-i18n="addSubject">Add a subject</h2>
      <input id="subjectName" maxlength="50" placeholder="Subject name" required>
      <div class="dialog-actions"><button value="cancel" class="quiet" data-i18n="cancel">Cancel</button><button id="confirmSubject" value="default" class="primary" data-i18n="add">Add</button></div>
    </form>
  </dialog>
  <dialog id="noteDialog">
    <form method="dialog">
      <h2 data-i18n="newNote">New note</h2><p data-i18n="newNotePrompt">Create a note for the selected subject?</p>
      <div class="dialog-actions"><button value="cancel" class="quiet" data-i18n="cancel">Cancel</button><button id="confirmNewNote" value="default" class="primary" data-i18n="create">Create</button></div>
    </form>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
