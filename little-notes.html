<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6750a4">
<title>Little Notes</title>
<style>
:root{--bg:#f6f3fb;--card:#fff;--ink:#272238;--muted:#716b82;--accent:#6750a4;--line:#e5deef;--soft:#eee8fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}body.dark{color-scheme:dark;--bg:#17151d;--card:#24212c;--ink:#f5f0ff;--muted:#b9b0c9;--accent:#c5b5ff;--line:#3a3446;--soft:#352d48}header{background:var(--card);border-bottom:1px solid var(--line);padding:16px}header>div,main{max-width:1050px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:1.35rem;margin:0}main{padding:18px 12px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;min-width:0}h2{font-size:1.05rem;margin:0 0 12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.stack{display:grid;gap:10px}button,input,select{font:inherit}button{border:0;border-radius:10px;padding:9px 12px;background:var(--soft);color:var(--ink);cursor:pointer}button.primary{background:var(--accent);color:white}input,select{width:100%;min-width:0;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}label{display:grid;gap:5px;font-size:.9rem;color:var(--muted)}.muted{color:var(--muted);font-size:.9rem}.subjects{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.subjects button{font-size:.85rem}.subjects button.active{background:var(--accent);color:white}.notes{display:grid;gap:8px;margin-top:12px}.note{display:block;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);overflow-wrap:anywhere}.note.active{border-color:var(--accent)}.note strong,.note small{display:block}.note small{color:#716b82;margin-top:4px}.editor{min-height:200px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);line-height:1.55;overflow-wrap:anywhere}.editor:empty:before{content:'Write your note here…';color:var(--muted)}.toolbar{display:flex;gap:5px;flex-wrap:wrap}.toolbar button{padding:7px 10px}.actions{display:flex;gap:7px;flex-wrap:wrap}.empty{text-align:center;color:var(--muted);padding:16px}.status{font-size:.85rem;color:var(--muted);min-height:1.2em}@media(max-width:720px){main{grid-template-columns:1fr;padding:12px 10px}.card{padding:12px}}
</style></head><body>
<header><div class="head"><div><h1>📒 Little Notes</h1><div class="muted">A small space for your study notes</div></div><div class="row"><button id="theme">🌙 Theme</button><button id="backup">⬇ Backup</button><button id="restore">⬆ Restore</button><input hidden type="file" id="file" accept=".json,application/json"></div></div></header>
<main><section class="card"><h2>📚 Subjects</h2><div id="subjects" class="subjects"></div><div class="row"><input id="search" type="search" placeholder="Search notes…" aria-label="Search notes"></div><div class="row" style="margin-top:9px"><button id="all">All notes</button><button id="favs">★ Favorites</button><button id="new" class="primary">＋ New note</button></div><div id="notes" class="notes"></div><p id="count" class="muted"></p></section>
<section class="card"><h2 id="heading">✍️ Create a note</h2><form id="form" class="stack"><label>Title<input id="title" maxlength="140" required placeholder="e.g. Chapter 1 summary"></label><div class="row"><label style="flex:1">Subject<select id="subject"></select></label><label style="flex:1">Chapter / lesson<input id="chapter" maxlength="100" placeholder="e.g. Lesson 3"></label></div><label>Content</label><div class="toolbar"><button type="button" data-cmd="bold"><b>B</b></button><button type="button" data-cmd="italic"><i>I</i></button><button type="button" data-cmd="underline"><u>U</u></button><button type="button" data-cmd="insertUnorderedList">• List</button><button type="button" data-cmd="insertOrderedList">1. List</button><select id="size" aria-label="Text size" style="width:auto"><option value="3">Normal</option><option value="2">Small</option><option value="4">Large</option><option value="5">XL</option></select><input id="color" type="color" value="#6750a4" aria-label="Text color" style="width:44px;padding:3px"></div><div id="content" class="editor" contenteditable="true" role="textbox" aria-label="Note content" aria-multiline="true"></div><div class="row"><label style="flex:1">Card color<select id="cardColor"><option value="default">Lavender</option><option value="pink">Pink</option><option value="blue">Blue</option><option value="green">Green</option><option value="yellow">Yellow</option></select></label><label style="display:flex;align-items:center;gap:7px"><input id="favorite" type="checkbox" style="width:auto"> ★ Favorite</label></div><div class="actions"><button class="primary" type="submit">Save note</button><button type="button" id="clear">Clear</button><button type="button" id="delete" hidden>Delete</button></div><div id="status" class="status" aria-live="polite"></div></form></section></main>
<script>
const SUBJECTS=['Kurdish','Arabic','English','Math','Geography','History','Economics','Philosophy','Computer','Religion','Other'];const PALETTE={default:'#eee8fb',pink:'#fde2ec',blue:'#dceeff',green:'#dcf5e3',yellow:'#fff1c7'};const $=id=>document.getElementById(id);let notes=[],selected=null,subjectFilter='All',onlyFav=false;try{notes=JSON.parse(localStorage.getItem('littleNotes.notes')||'[]');if(!Array.isArray(notes))notes=[]}catch{notes=[]}
function persist(){try{localStorage.setItem('littleNotes.notes',JSON.stringify(notes));$('status').textContent='Saved on this device.'}catch{$('status').textContent='Could not save. Download a backup.'}}
function setupSubjects(){const box=$('subjects');box.replaceChildren();SUBJECTS.forEach(s=>{let b=document.createElement('button');b.textContent=s;b.className=subjectFilter===s?'active':'';b.onclick=()=>{subjectFilter=s;onlyFav=false;setupSubjects();render()};box.append(b)});$('subject').innerHTML='';SUBJECTS.forEach(s=>{let o=document.createElement('option');o.value=s;o.textContent=s;$('subject').append(o)})}
function plain(html){let d=document.createElement('div');d.innerHTML=html;return d.textContent||''}
function render(){let q=$('search').value.trim().toLowerCase();let list=notes.filter(n=>(subjectFilter==='All'||n.subject===subjectFilter)&&(!onlyFav||n.favorite)&&(!q||(n.title+' '+n.subject+' '+n.chapter+' '+plain(n.content)).toLowerCase().includes(q))).sort((a,b)=>b.updated-a.updated);$('notes').replaceChildren();if(!list.length){let e=document.createElement('div');e.className='empty';e.textContent='No notes found. Create your first note!';$('notes').append(e)}list.forEach(n=>{let b=document.createElement('button');b.className='note'+(n.id===selected?' active':'');b.style.background=PALETTE[n.cardColor]||'var(--card)';let t=document.createElement('strong');t.textContent=(n.favorite?'★ ':'')+n.title;let s=document.createElement('small');s.textContent=n.subject+(n.chapter?' · '+n.chapter:'');let p=document.createElement('small');p.textContent=plain(n.content).slice(0,100);b.append(t,s,p);b.onclick=()=>loadNote(n.id);$('notes').append(b)});$('count').textContent=list.length+' note'+(list.length===1?'':'s')}
function reset(){selected=null;$('form').reset();$('content').innerHTML='';$('subject').value=SUBJECTS.includes(subjectFilter)?subjectFilter:'Kurdish';$('cardColor').value='default';$('heading').textContent='✍️ Create a note';$('delete').hidden=true;$('status').textContent='';render()}
function loadNote(id){let n=notes.find(x=>x.id===id);if(!n)return;selected=id;$('title').value=n.title;$('subject').value=n.subject;$('chapter').value=n.chapter||'';$('content').innerHTML=n.content||'';$('favorite').checked=!!n.favorite;$('cardColor').value=n.cardColor||'default';$('heading').textContent='✍️ Edit note';$('delete').hidden=false;$('status').textContent='';render()}
$('form').onsubmit=e=>{e.preventDefault();let title=$('title').value.trim();if(!title)return;let n={id:selected||('n'+Date.now()+Math.random().toString(16).slice(2)),title,subject:$('subject').value,chapter:$('chapter').value.trim(),content:$('content').innerHTML,favorite:$('favorite').checked,cardColor:$('cardColor').value,updated:Date.now()};let i=notes.findIndex(x=>x.id===n.id);if(i<0)notes.push(n);else notes[i]=n;selected=n.id;persist();$('heading').textContent='✍️ Edit note';$('delete').hidden=false;render()};$('new').onclick=reset;$('clear').onclick=reset;$('search').oninput=render;$('all').onclick=()=>{subjectFilter='All';onlyFav=false;setupSubjects();render()};$('favs').onclick=()=>{subjectFilter='All';onlyFav=true;setupSubjects();render()};$('delete').onclick=()=>{if(selected&&confirm('Delete this note?')){notes=notes.filter(n=>n.id!==selected);persist();reset()}};
document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{$('content').focus();document.execCommand(b.dataset.cmd,false,null)});$('size').onchange=e=>{$('content').focus();document.execCommand('fontSize',false,e.target.value)};$('color').oninput=e=>{$('content').focus();document.execCommand('foreColor',false,e.target.value)};$('theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('littleNotes.dark',document.body.classList.contains('dark')?'1':'0')};if(localStorage.getItem('littleNotes.dark')==='1')document.body.classList.add('dark');
$('backup').onclick=()=>{let blob=new Blob([JSON.stringify({app:'Little Notes',version:1,notes},null,2)],{type:'application/json'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='little-notes-backup.json';a.click();URL.revokeObjectURL(u)};$('restore').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text()),items=Array.isArray(data)?data:data.notes;if(!Array.isArray(items))throw Error();if(confirm('Add notes from this backup?')){let ids=new Set(notes.map(n=>n.id));items.forEach(n=>{if(n&&typeof n.title==='string')notes.push({...n,id:ids.has(n.id)?'import-'+Date.now()+'-'+Math.random().toString(16).slice(2):n.id,updated:Number(n.updated)||Date.now()})});persist();render();alert('Backup restored.')}}catch{alert('Could not read that backup file.')}finally{e.target.value=''}};setupSubjects();$('subject').value='Kurdish';render();
</script></body></html>
